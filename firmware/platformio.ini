; cyd-deck firmware for the ESP32-3248S035R (3.5" resistive CYD)
; Build and flash from VS Code with the PlatformIO toolbar, or:
;   pio run -t upload && pio device monitor

[env:cyd35r]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 921600
board_build.partitions = huge_app.csv
build_flags =
  -D LV_CONF_INCLUDE_SIMPLE
  -I include
  -I src
  -D CORE_DEBUG_LEVEL=0
lib_deps =
  lovyan03/LovyanGFX@1.1.16
  lvgl/lvgl@8.3.11
  bblanchon/ArduinoJson@7.2.1
